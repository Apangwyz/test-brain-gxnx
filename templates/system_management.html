<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
        }
        
        .sidebar {
            min-height: 100vh;
            background-color: #2d3436;
        }
        
        .sidebar a {
            color: #b2bec3;
            transition: all 0.3s;
        }
        
        .sidebar a:hover {
            color: white;
            background-color: #636e72;
        }
        
        .sidebar .active {
            background-color: #0984e3;
            color: white;
        }
        
        .content-area {
            min-height: 100vh;
            padding: 20px;
        }
        
        .card {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-active {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-inactive {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box .fa-search {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        
        .search-box input {
            padding-left: 36px;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .modal-header .btn-close {
            color: white;
        }
        
        .table th {
            font-weight: 600;
            color: #495057;
        }
        
        .system-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .system-name {
            font-weight: 600;
            color: #2d3436;
        }
        
        .system-code {
            font-size: 12px;
            color: #6c757d;
        }
        
        .stats-card {
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stats-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="sidebar-sticky">
                    <h5 class="text-white px-4 py-4 font-weight-bold">测试用例管理系统</h5>
                    <div class="nav flex-column">
                        <a href="/" class="nav-link px-4 py-3">
                            <i class="fa-solid fa-home mr-2"></i> 首页
                        </a>
                        <a href="/system/" class="nav-link px-4 py-3 active">
                            <i class="fa-solid fa-network-wired mr-2"></i> 系统管理
                        </a>
                        <a href="/knowledge/" class="nav-link px-4 py-3">
                            <i class="fa-solid fa-book-open mr-2"></i> 知识库
                        </a>
                        <a href="/upload/" class="nav-link px-4 py-3">
                            <i class="fa-solid fa-upload mr-2"></i> 文件上传
                        </a>
                    </div>
                </div>
            </nav>

            <!-- 主内容区域 -->
            <main class="col-md-10 content-area">
                <div class="d-flex justify-content-between align-items-center mb-6">
                    <div>
                        <h1 class="h2">系统管理</h1>
                        <p class="text-muted">管理外围系统清单，维护系统信息</p>
                    </div>
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i class="fa-solid fa-plus mr-2"></i> 新增系统
                    </button>
                </div>

                <!-- 统计卡片 -->
                <div class="row mb-6">
                    <div class="col-md-4">
                        <div class="card stats-card p-4">
                            <div class="d-flex align-items-center">
                                <div class="system-icon mr-3">
                                    <i class="fa-solid fa-server"></i>
                                </div>
                                <div>
                                    <p class="text-muted text-sm">总系统数</p>
                                    <p class="h3 font-bold" id="stats-total">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card p-4">
                            <div class="d-flex align-items-center">
                                <div class="system-icon mr-3" style="background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);">
                                    <i class="fa-solid fa-check-circle"></i>
                                </div>
                                <div>
                                    <p class="text-muted text-sm">已启用</p>
                                    <p class="h3 font-bold" id="stats-active">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stats-card p-4">
                            <div class="d-flex align-items-center">
                                <div class="system-icon mr-3" style="background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);">
                                    <i class="fa-solid fa-circle-xmark"></i>
                                </div>
                                <div>
                                    <p class="text-muted text-sm">已停用</p>
                                    <p class="h3 font-bold" id="stats-inactive">0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 搜索和筛选 -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="search-box">
                                    <i class="fa-solid fa-search"></i>
                                    <input type="text" class="form-control" id="search-input" placeholder="搜索系统名称或编码..." onkeyup="handleSearch()">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" id="status-filter" onchange="handleFilter()">
                                    <option value="">全部状态</option>
                                    <option value="active">已启用</option>
                                    <option value="inactive">已停用</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-outline-secondary w-100" onclick="clearFilters()">
                                    <i class="fa-solid fa-filter-slash mr-1"></i> 清除筛选
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 系统列表 -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>系统名称</th>
                                        <th>系统编码</th>
                                        <th>描述</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="system-table-body">
                                    <!-- 数据将通过JS动态加载 -->
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-state" class="text-center py-8" style="display: none;">
                            <i class="fa-solid fa-server text-muted" style="font-size: 48px;"></i>
                            <p class="text-muted mt-3">暂无系统数据</p>
                            <button class="btn btn-primary mt-2" onclick="openAddModal()">
                                <i class="fa-solid fa-plus mr-2"></i> 新增系统
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 新增/编辑系统弹窗 -->
    <div class="modal fade" id="system-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title">新增系统</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="system-form">
                        <input type="hidden" id="system-id">
                        <div class="mb-3">
                            <label for="system-name" class="form-label">系统名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="system-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="system-code" class="form-label">系统编码 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="system-code" required>
                        </div>
                        <div class="mb-3">
                            <label for="system-description" class="form-label">系统描述</label>
                            <textarea class="form-control" id="system-description" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="system-status" class="form-label">状态</label>
                            <select class="form-select" id="system-status">
                                <option value="active">启用</option>
                                <option value="inactive">停用</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveSystem()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 关联数据弹窗 -->
    <div class="modal fade" id="related-modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">系统关联数据</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="related-system-info" class="mb-4 p-3 bg-light rounded"></div>
                    <div class="row">
                        <div class="col-md-4">
                            <h6>需求文档</h6>
                            <div id="related-requirements" class="border rounded p-2 min-h-[150px]"></div>
                        </div>
                        <div class="col-md-4">
                            <h6>测试用例</h6>
                            <div id="related-testcases" class="border rounded p-2 min-h-[150px]"></div>
                        </div>
                        <div class="col-md-4">
                            <h6>测试计划</h6>
                            <div id="related-plans" class="border rounded p-2 min-h-[150px]"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal fade" id="delete-modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除系统 <span id="delete-system-name" class="font-bold"></span> 吗？</p>
                    <p class="text-warning small">如果该系统存在关联数据，将无法删除。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let systems = [];
        let deleteSystemId = null;

        // 获取系统列表
        async function fetchSystems() {
            try {
                const params = new URLSearchParams();
                const search = document.getElementById('search-input').value;
                const status = document.getElementById('status-filter').value;
                
                if (search) {
                    params.set('keyword', search);
                }
                if (status) {
                    params.set('status', status);
                }
                
                const response = await fetch(`/api/systems/?${params}`);
                const data = await response.json();
                
                if (data.success) {
                    systems = data.systems;
                    renderSystems(systems);
                }
            } catch (error) {
                showToast('获取系统列表失败', 'error');
            }
        }

        // 获取统计数据
        async function fetchStats() {
            try {
                const response = await fetch('/api/systems/stats/');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('stats-total').textContent = data.stats.total;
                    document.getElementById('stats-active').textContent = data.stats.active;
                    document.getElementById('stats-inactive').textContent = data.stats.inactive;
                }
            } catch (error) {
                console.error('获取统计数据失败:', error);
            }
        }

        // 渲染系统列表
        function renderSystems(systemList) {
            const tbody = document.getElementById('system-table-body');
            const emptyState = document.getElementById('empty-state');
            
            if (systemList.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            tbody.innerHTML = systemList.map(system => `
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="system-icon mr-3">${system.name.charAt(0)}</div>
                            <div>
                                <div class="system-name">${system.name}</div>
                                <div class="system-code">${system.code}</div>
                            </div>
                        </div>
                    </td>
                    <td>${system.code}</td>
                    <td>${system.description || '-'}</td>
                    <td>
                        <span class="status-badge ${system.status === 'active' ? 'status-active' : 'status-inactive'}">
                            ${system.status === 'active' ? '启用' : '停用'}
                        </span>
                    </td>
                    <td>${formatDateTime(system.created_at)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-info mr-1" onclick="viewRelated(${system.id})">
                            <i class="fa-solid fa-link"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-primary mr-1" onclick="openEditModal(${system.id})">
                            <i class="fa-solid fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal(${system.id}, '${system.name}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 格式化日期时间
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '-';
            const date = new Date(dateTimeStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 搜索处理
        function handleSearch() {
            fetchSystems();
        }

        // 筛选处理
        function handleFilter() {
            fetchSystems();
        }

        // 清除筛选
        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-filter').value = '';
            fetchSystems();
        }

        // 打开新增弹窗
        function openAddModal() {
            document.getElementById('modal-title').textContent = '新增系统';
            document.getElementById('system-id').value = '';
            document.getElementById('system-name').value = '';
            document.getElementById('system-code').value = '';
            document.getElementById('system-description').value = '';
            document.getElementById('system-status').value = 'active';
            document.getElementById('system-name').focus();
            new bootstrap.Modal(document.getElementById('system-modal')).show();
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            const system = systems.find(s => s.id === id);
            if (!system) return;
            
            document.getElementById('modal-title').textContent = '编辑系统';
            document.getElementById('system-id').value = system.id;
            document.getElementById('system-name').value = system.name;
            document.getElementById('system-code').value = system.code;
            document.getElementById('system-description').value = system.description || '';
            document.getElementById('system-status').value = system.status;
            new bootstrap.Modal(document.getElementById('system-modal')).show();
        }

        // 打开删除确认弹窗
        function openDeleteModal(id, name) {
            deleteSystemId = id;
            document.getElementById('delete-system-name').textContent = name;
            new bootstrap.Modal(document.getElementById('delete-modal')).show();
        }

        // 保存系统
        async function saveSystem() {
            const id = document.getElementById('system-id').value;
            const name = document.getElementById('system-name').value.trim();
            const code = document.getElementById('system-code').value.trim();
            const description = document.getElementById('system-description').value.trim();
            const status = document.getElementById('system-status').value;
            
            if (!name || !code) {
                showToast('系统名称和编码不能为空', 'warning');
                return;
            }
            
            try {
                const url = id ? `/api/systems/${id}/` : '/api/systems/';
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, code, description, status })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('system-modal')).hide();
                    fetchSystems();
                    fetchStats();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('保存失败', 'error');
            }
        }

        // 删除系统
        async function confirmDelete() {
            if (!deleteSystemId) return;
            
            try {
                const response = await fetch(`/api/systems/${deleteSystemId}/`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    bootstrap.Modal.getInstance(document.getElementById('delete-modal')).hide();
                    fetchSystems();
                    fetchStats();
                } else {
                    showToast(data.message, 'warning');
                }
            } catch (error) {
                showToast('删除失败', 'error');
            }
            
            deleteSystemId = null;
        }

        // 查看关联数据
        async function viewRelated(systemId) {
            try {
                const response = await fetch(`/api/systems/${systemId}/related/`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('related-system-info').innerHTML = `
                        <strong>系统：</strong>${data.system.name} (${data.system.code})<br>
                        <strong>关联统计：</strong>需求文档 ${data.related_data.counts.requirements} 个，测试用例 ${data.related_data.counts.test_cases} 个，测试计划 ${data.related_data.counts.test_plans} 个
                    `;
                    
                    renderRelatedList('related-requirements', data.related_data.requirements);
                    renderRelatedList('related-testcases', data.related_data.test_cases);
                    renderRelatedList('related-plans', data.related_data.test_plans);
                    
                    new bootstrap.Modal(document.getElementById('related-modal')).show();
                }
            } catch (error) {
                showToast('获取关联数据失败', 'error');
            }
        }

        // 渲染关联列表
        function renderRelatedList(containerId, items) {
            const container = document.getElementById(containerId);
            
            if (!items || items.length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-2">暂无数据</p>';
                return;
            }
            
            container.innerHTML = `
                <ul class="list-group list-group-flush">
                    ${items.map(item => `
                        <li class="list-group-item p-2 small">${item.title}</li>
                    `).join('')}
                </ul>
            `;
        }

        // 显示提示
        function showToast(message, type) {
            const toastContainer = document.createElement('div');
            toastContainer.className = `toast position-fixed bottom-4 right-4 text-white ${type === 'success' ? 'bg-success' : type === 'error' ? 'bg-danger' : type === 'warning' ? 'bg-warning' : 'bg-info'}`;
            toastContainer.style.zIndex = '9999';
            toastContainer.innerHTML = `
                <div class="toast-body">
                    <i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'} mr-2"></i>
                    ${message}
                </div>
            `;
            document.body.appendChild(toastContainer);
            
            const toast = new bootstrap.Toast(toastContainer, { autohide: true, delay: 3000 });
            toast.show();
            
            toast.addEventListener('hidden.bs.toast', () => {
                toastContainer.remove();
            });
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            fetchSystems();
            fetchStats();
        });
    </script>
</body>
</html>
