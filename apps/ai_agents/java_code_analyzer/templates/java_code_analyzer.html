{% extends "base.html" %}
{% load static %}

{% block title %}TestBrain - Java源码分析{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'common_progress.css' %}">
<style>
    .analyzer-container {
        margin: 20px;
        padding: 20px;
    }
    
    .analyzer-form {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
    }
    
    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }
    
    .form-select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }
    
    .submit-container {
        text-align: center;
        margin-top: 30px;
    }
    
    .submit-button {
        padding: 12px 40px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    
    .submit-button:hover {
        background-color: #0056b3;
    }
    
    .submit-button:disabled {
        background-color: #6c757d;
        cursor: not-allowed;
    }
    
    .result-container {
        margin-top: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: #f8f9fa;
        display: none;
    }
    
    .analysis-result {
        margin-top: 20px;
        white-space: pre-wrap;
        background: #000;
        color: #fff;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        max-height: 600px;
        overflow-y: auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="analyzer-container">
    <h4 class="mb-4">Java源码分析</h4>
    
    <div class="analyzer-form">
        <form id="javaCodeAnalysisForm">
            <div class="form-group">
                <label for="targetService" class="form-label">目标服务</label>
                <select id="targetService" class="form-select" required>
                    <option value="">请选择目标服务</option>
                    <option value="test_coverage_demo">test_coverage_demo</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="baseCommit" class="form-label">Base Commit</label>
                <input type="text" id="baseCommit" class="form-control" placeholder="请输入base commit哈希值" required>
            </div>
            
            <div class="form-group">
                <label for="newCommit" class="form-label">New Commit</label>
                <input type="text" id="newCommit" class="form-control" placeholder="请输入new commit哈希值" required>
            </div>
            
            <div class="form-group">
                <label for="llmProvider" class="form-label">大模型提供商</label>
                <select id="llmProvider" class="form-select">
                    {% for key, provider in llm_providers.items %}
                    <option value="{{ key }}" {% if key == llm_provider %}selected{% endif %}>
                        {{ provider.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="submit-container">
                <button type="submit" class="submit-button" id="analyzeBtn">开始分析</button>
            </div>
        </form>
    </div>

    <!-- 分析结果展示区域 -->
    <div id="analysis-result" class="result-container">
        <h3>分析结果</h3>
        <div id="result-message"></div>
        <a id="download-link" href="#" class="btn btn-success mt-3">下载分析报告</a>
        <div class="analysis-result" id="result-content"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'java_code_analyzer.js' %}"></script>
{% endblock %}
