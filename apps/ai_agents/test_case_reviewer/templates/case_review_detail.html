{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestBrain - 测试用例AI评审</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body {
            padding: 24px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section .section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .detail-section .section-value {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.7;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            min-height: 44px;
            white-space: pre-wrap;
        }
        .detail-section textarea.section-value {
            resize: vertical;
            min-height: 80px;
        }
        .detail-section select.section-value {
            min-height: 40px;
            appearance: auto;
        }
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .review-result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .review-result-grid {
                grid-template-columns: 1fr;
            }
        }
        .btn-group-footer {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-title">
            <i class="fas fa-robot" style="color: var(--accent);"></i>
            测试用例AI评审
        </div>

        <div class="card" style="overflow: visible;">
            <div class="card-body">
                <form id="caseReviewForm">
                    <input type="hidden" id="test_case_id" name="test_case_id" value="{{ test_case_id }}">

                    <div class="detail-section">
                        <label class="section-label" for="status">状态<span class="required-mark">*</span></label>
                        <select class="form-control" id="status" name="status">
                            <option value="pending">待评审</option>
                            <option value="approved">评审通过</option>
                            <option value="rejected">评审未通过</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="detail-section">
                                <label class="section-label" for="bu">BU</label>
                                <select class="form-control" id="bu" name="bu">
                                    <option value="">请选择 BU</option>
                                    <option value="education">教育</option>
                                    <option value="user_center">用户中心</option>
                                    <option value="collaboration">协同</option>
                                    <option value="im">IM</option>
                                    <option value="workspace">工作台</option>
                                    <option value="recruitment">招聘</option>
                                    <option value="work_management">工作管理</option>
                                    <option value="ai_application">AI 应用</option>
                                    <option value="operation_platform">运营平台</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="detail-section">
                                <label class="section-label" for="feature">Feature</label>
                                <select class="form-control" id="feature" name="feature">
                                    <option value="">请选择 Feature</option>
                                    <option value="feature1">Feature1</option>
                                    <option value="feature2">Feature2</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="detail-section">
                                <label class="section-label" for="priority">Priority</label>
                                <select class="form-control" id="priority" name="priority">
                                    <option value="">请选择优先级</option>
                                    <option value="p0">P0</option>
                                    <option value="p1">P1</option>
                                    <option value="p2">P2</option>
                                    <option value="p3">P3</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <label class="section-label" for="description">用例描述<span class="required-mark">*</span></label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="detail-section">
                        <label class="section-label" for="test_steps">测试步骤</label>
                        <textarea class="form-control" id="test_steps" name="test_steps" rows="5"></textarea>
                    </div>
                    <div class="detail-section">
                        <label class="section-label" for="expected_results">预期结果</label>
                        <textarea class="form-control" id="expected_results" name="expected_results" rows="5"></textarea>
                    </div>

                    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                        <div class="section-label" style="margin-bottom: 12px;">AI 评审结果</div>
                        <div class="review-result-grid">
                            <div class="detail-section">
                                <label class="section-label" for="review_conclusion">评审结论</label>
                                <textarea class="form-control" id="review_conclusion" name="review_conclusion" rows="2"></textarea>
                            </div>
                            <div class="detail-section">
                                <label class="section-label" for="review_level">评审等级</label>
                                <textarea class="form-control" id="review_level" name="review_level" rows="2"></textarea>
                            </div>
                            <div class="detail-section">
                                <label class="section-label" for="review_opinions">评审意见</label>
                                <textarea class="form-control" id="review_opinions" name="review_opinions" rows="4"></textarea>
                            </div>
                            <div class="detail-section">
                                <label class="section-label" for="improvements">待改进项</label>
                                <textarea class="form-control" id="improvements" name="improvements" rows="4"></textarea>
                            </div>
                            <div class="detail-section">
                                <label class="section-label" for="advantages">优点</label>
                                <textarea class="form-control" id="advantages" name="advantages" rows="3"></textarea>
                            </div>
                            <div class="detail-section">
                                <label class="section-label" for="other_suggestions">其他建议</label>
                                <textarea class="form-control" id="other_suggestions" name="other_suggestions" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="btn-group-footer">
                        <button type="button" class="btn btn-primary" id="aiReviewBtn">
                            <i class="fas fa-robot"></i> AI评审
                        </button>
                        <button type="button" class="btn btn-success" id="saveBtn">
                            <i class="fas fa-save"></i> 保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'js/extra/jquery.min.js' %}"></script>
    <script src="{% static 'js/extra/all.min.js' %}"></script>
    <script src="{% static 'js/extra/bootstrap.bundle.min.js' %}" data-no-maps></script>

    <script>
    function getCookie(name) {
        let cv = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return cv ? cv.pop() : '';
    }

    $(document).ready(function() {
        // Get test_case_id from URL
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const testCaseId = pathParts[pathParts.length - 1] || '{{ test_case_id|default:"" }}';
        $('#test_case_id').val(testCaseId);

        // Load test case data
        if (testCaseId) {
            $.getJSON('/test_case_reviewer/case-review-detail/api/test-case/' + testCaseId + '/', function(data) {
                if (data.success) {
                    const tc = data.test_case;
                    $('#status').val(tc.status || 'pending');
                    $('#bu').val(tc.bu || '');
                    $('#feature').val(tc.feature || '');
                    $('#priority').val(tc.priority || '');
                    $('#description').val(tc.description || '');
                    $('#test_steps').val(tc.test_steps || '');
                    $('#expected_results').val(tc.expected_results || '');
                    if (tc.review_result) {
                        const r = tc.review_result;
                        $('#review_conclusion').val(r.评审结论 || '');
                        $('#review_level').val(r.评审等级 || '');
                        $('#review_opinions').val(r.评审意见 || '');
                        $('#improvements').val(r.待改进项 || '');
                        $('#advantages').val(r.优点 || '');
                        $('#other_suggestions').val(r.其他建议 || '');
                    }
                }
            });
        }

        // AI Review
        $('#aiReviewBtn').click(function() {
            const btn = $(this);
            btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> 评审中...');
            $.ajax({
                url: '/test_case_reviewer/case-review-detail/api/review/',
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                contentType: 'application/json',
                data: JSON.stringify({ test_case_id: testCaseId }),
                success: function(data) {
                    if (data.success) {
                        const r = data.review_result;
                        $('#review_conclusion').val(r.评审结论 || '');
                        $('#review_level').val(r.评审等级 || '');
                        $('#review_opinions').val(r.评审意见 || '');
                        $('#improvements').val(r.待改进项 || '');
                        $('#advantages').val(r.优点 || '');
                        $('#other_suggestions').val(r.其他建议 || '');
                        alert('AI评审完成！');
                    } else {
                        alert('评审失败：' + (data.message || '未知错误'));
                    }
                },
                error: function() { alert('评审请求失败'); },
                complete: function() {
                    btn.prop('disabled', false).html('<i class="fas fa-robot"></i> AI评审');
                }
            });
        });

        // Save
        $('#saveBtn').click(function() {
            const formData = {
                test_case_id: testCaseId,
                status: $('#status').val(),
                bu: $('#bu').val(),
                feature: $('#feature').val(),
                priority: $('#priority').val(),
                description: $('#description').val(),
                test_steps: $('#test_steps').val(),
                expected_results: $('#expected_results').val()
            };
            $.ajax({
                url: '/test_case_reviewer/case-review-detail/api/update-test-case/',
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(data) {
                    if (data.success) {
                        alert('保存成功！');
                        if (window.opener) { window.opener.location.reload(); }
                        window.close();
                    } else {
                        alert('保存失败：' + (data.message || '未知错误'));
                    }
                },
                error: function() { alert('保存请求失败'); }
            });
        });

        // Feature select - add custom option
        const featureSelect = document.getElementById('feature');
        const addNewOpt = document.createElement('option');
        addNewOpt.value = 'add_new';
        addNewOpt.textContent = '+ 添加新 Feature';
        featureSelect.appendChild(addNewOpt);
        featureSelect.addEventListener('change', function() {
            if (this.value === 'add_new') {
                const name = prompt('请输入新的 Feature 名称：');
                if (name && name.trim()) {
                    const opt = document.createElement('option');
                    opt.value = name.toLowerCase().replace(/\s+/g, '_');
                    opt.textContent = name;
                    featureSelect.insertBefore(opt, addNewOpt);
                    this.value = opt.value;
                } else { this.value = ''; }
            }
        });
    });
    </script>
</body>
</html>
