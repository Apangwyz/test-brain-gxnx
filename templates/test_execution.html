{% extends "base.html" %}

{% block title %}测试执行 - TestBrain{% endblock %}

{% block extra_css %}
<style>
.status-badge { padding: 3px 10px; border-radius: var(--radius-xl); font-size: 12px; font-weight: 600; display: inline-block; }
.status-passed { background: var(--success-muted); color: var(--success); }
.status-failed { background: var(--danger-muted); color: var(--danger); }
.status-running { background: var(--warning-muted); color: var(--warning); }
.status-skipped { background: var(--bg-tertiary); color: var(--text-tertiary); }
.status-error { background: var(--danger-muted); color: var(--danger); }
.log-content-box {
    max-height: 300px;
    overflow-y: auto;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
}
.execute-pulse-btn {
    animation: pulse-glow 2s infinite;
}
@keyframes pulse-glow {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
}
.search-filter-bar select, .search-filter-bar input {
    width: auto; display: inline-block;
}
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h4>自动化测试用例执行</h4>
    <p>管理测试用例的自动化执行，查看执行记录和统计分析</p>
</div>

<div class="row mb-4">
    <div class="col-md-3 mb-3 mb-md-0">
        <div class="stat-card d-flex align-items-center gap-3">
            <div class="stat-icon" style="background: var(--accent-muted); color: var(--accent);"><i class="fas fa-list"></i></div>
            <div>
                <div class="stat-number" id="stats-total">0</div>
                <div class="stat-label">总执行次数</div>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-3 mb-md-0">
        <div class="stat-card d-flex align-items-center gap-3">
            <div class="stat-icon" style="background: var(--success-muted); color: var(--success);"><i class="fas fa-check-circle"></i></div>
            <div>
                <div class="stat-number" id="stats-passed">0</div>
                <div class="stat-label">通过</div>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-3 mb-md-0">
        <div class="stat-card d-flex align-items-center gap-3">
            <div class="stat-icon" style="background: var(--danger-muted); color: var(--danger);"><i class="fas fa-times-circle"></i></div>
            <div>
                <div class="stat-number" id="stats-failed">0</div>
                <div class="stat-label">失败</div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card d-flex align-items-center gap-3">
            <div class="stat-icon" style="background: var(--warning-muted); color: var(--warning);"><i class="fas fa-spinner"></i></div>
            <div>
                <div class="stat-number" id="stats-running">0</div>
                <div class="stat-label">执行中</div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2" style="margin-bottom: 20px;">
            <div class="d-flex gap-2 search-filter-bar">
                <input type="text" class="form-control" id="search-input" placeholder="搜索用例..." style="width: 200px;" oninput="handleSearch()">
                <select class="form-control" id="status-filter" style="width: 120px;" onchange="handleFilter()">
                    <option value="">全部状态</option>
                    <option value="passed">通过</option>
                    <option value="failed">失败</option>
                    <option value="running">执行中</option>
                    <option value="skipped">跳过</option>
                    <option value="error">错误</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary execute-pulse-btn" onclick="openExecuteModal()">
                    <i class="fas fa-play"></i> 执行测试用例
                </button>
                <button class="btn btn-secondary" onclick="refreshRecords()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>用例标题</th>
                        <th>状态</th>
                        <th>开始时间</th>
                        <th>耗时</th>
                        <th style="width: 80px;">操作</th>
                    </tr>
                </thead>
                <tbody id="records-table-body"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center" style="padding-top: 16px; border-top: 1px solid var(--border-color);">
            <small style="color: var(--text-tertiary);">共 <span id="total-count">0</span> 条记录</small>
            <div class="d-flex align-items-center gap-2" style="font-size: 13px;">
                <span id="page-info" style="color: var(--text-secondary);"></span>
                <button class="btn btn-sm btn-secondary" onclick="prevPage()" id="prev-page"><i class="fas fa-chevron-left"></i></button>
                <button class="btn btn-sm btn-secondary" onclick="nextPage()" id="next-page"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- Execute Modal -->
<div class="modal fade" id="execute-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">执行测试用例</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="execute-content">
                    <div class="text-center py-5"><div class="spinner"></div><p style="color: var(--text-secondary); margin-top: 12px;">加载测试用例列表...</p></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="detail-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="detail-title">执行详情</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">用例标题</label>
                        <input class="form-control" id="detail-case-title" readonly>
                    </div>
                    <div class="col-md-3">
                        <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">状态</label>
                        <div><span id="detail-status"></span></div>
                    </div>
                    <div class="col-md-3">
                        <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">耗时</label>
                        <input class="form-control" id="detail-duration" readonly>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">开始时间</label>
                        <input class="form-control" id="detail-start-time" readonly>
                    </div>
                </div>
                <div class="form-group">
                    <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">执行日志</label>
                    <div class="log-content-box" id="detail-log"></div>
                </div>
                <div id="error-section" style="display: none;">
                    <div class="form-group">
                        <label style="font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;">错误信息</label>
                        <div class="log-content-box" id="detail-error" style="color: var(--danger);"></div>
                    </div>
                    <button class="btn btn-warning" id="retry-btn" onclick="retryExecution()"><i class="fas fa-redo"></i> 重试</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let records = [];
let currentPage = 1;
let totalPages = 1;
const pageSize = 10;

$(document).ready(function() {
    fetchExecutionRecords();
    fetchStats();
});

function fetchExecutionRecords(page) {
    page = page || currentPage;
    fetch('/api/test-execution/records/?page=' + page + '&page_size=' + pageSize)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                records = data.records;
                currentPage = data.page;
                totalPages = data.total_pages;
                renderRecords(records);
                document.getElementById('total-count').textContent = data.total;
                document.getElementById('page-info').textContent = (currentPage - 1) * pageSize + 1 + '-' + Math.min(currentPage * pageSize, data.total);
                document.getElementById('prev-page').disabled = currentPage <= 1;
                document.getElementById('next-page').disabled = currentPage >= totalPages;
            }
        });
}

function fetchStats() {
    fetch('/api/test-execution/stats/')
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                document.getElementById('stats-total').textContent = data.stats.total;
                document.getElementById('stats-passed').textContent = data.stats.passed;
                document.getElementById('stats-failed').textContent = data.stats.failed;
                document.getElementById('stats-running').textContent = data.stats.running;
            }
        });
}

function renderRecords(items) {
    const tbody = document.getElementById('records-table-body');
    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="padding: 48px; color: var(--text-tertiary);"><i class="fas fa-inbox fa-2x" style="margin-bottom: 12px; display: block;"></i>暂无执行记录</td></tr>';
        return;
    }
    tbody.innerHTML = items.map(r => `
        <tr>
            <td><strong style="color: var(--text-primary);">${r.test_case_title}</strong><br><small style="color: var(--text-tertiary);">${r.test_case_description || ''}</small></td>
            <td><span class="status-badge status-${r.status}">${r.status_display || r.status}</span></td>
            <td style="color: var(--text-secondary);">${formatDate(r.start_time)}</td>
            <td style="color: var(--text-secondary);">${r.duration ? r.duration.toFixed(2) + 's' : '-'}</td>
            <td><button class="btn btn-sm btn-primary" aria-label="查看详情" onclick="viewDetail(${r.id})"><i class="fas fa-eye"></i></button></td>
        </tr>
    `).join('');
}

function handleSearch() {
    filterRecords(document.getElementById('search-input').value.toLowerCase(), document.getElementById('status-filter').value);
}
function handleFilter() {
    filterRecords(document.getElementById('search-input').value.toLowerCase(), document.getElementById('status-filter').value);
}
function filterRecords(keyword, status) {
    let filtered = records;
    if (keyword) filtered = filtered.filter(r => (r.test_case_title || '').toLowerCase().includes(keyword) || (r.test_case_description || '').toLowerCase().includes(keyword));
    if (status) filtered = filtered.filter(r => r.status === status);
    renderRecords(filtered);
}

function openExecuteModal() {
    const content = document.getElementById('execute-content');
    content.innerHTML = '<div class="text-center py-5"><div class="spinner"></div><p style="color: var(--text-secondary); margin-top: 12px;">加载测试用例列表...</p></div>';
    $('#execute-modal').modal('show');

    fetch('/api/test-execution/test-cases/')
        .then(r => r.json())
        .then(data => {
            if (data.success && data.test_cases.length > 0) {
                content.innerHTML = '<div class="list-group">' +
                    data.test_cases.map(tc => `
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <span>${tc.title}</span>
                            <button class="btn btn-sm btn-primary" onclick="executeSingleCase(${tc.id})"><i class="fas fa-play"></i> 执行</button>
                        </div>
                    `).join('') + '</div>';
            } else {
                content.innerHTML = '<div class="text-center py-5"><i class="fas fa-inbox fa-2x" style="color: var(--text-tertiary); margin-bottom: 12px; display: block;"></i><p style="color: var(--text-secondary);">暂无可用测试用例</p></div>';
            }
        })
        .catch(() => {
            content.innerHTML = '<div class="text-center py-5"><p style="color: var(--danger);">加载失败，请稍后重试</p></div>';
        });
}

async function executeSingleCase(testCaseId) {
    const content = document.getElementById('execute-content');
    content.innerHTML = '<div class="text-center py-5"><div class="spinner"></div><p style="color: var(--text-secondary); margin-top: 12px;">正在执行测试用例...</p></div>';
    try {
        const resp = await fetch('/api/test-execution/execute/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ test_case_id: testCaseId })
        });
        const data = await resp.json();
        if (data.success) {
            content.innerHTML = '<div class="text-center py-5"><i class="fas fa-check-circle fa-2x" style="color: var(--success); margin-bottom: 12px; display: block;"></i><p style="color: var(--success);">执行完成</p></div>';
            setTimeout(() => { $('#execute-modal').modal('hide'); fetchExecutionRecords(); fetchStats(); }, 1500);
        } else {
            content.innerHTML = '<div class="text-center py-5"><p style="color: var(--danger);">执行失败：' + (data.message || '未知错误') + '</p></div>';
        }
    } catch (e) {
        content.innerHTML = '<div class="text-center py-5"><p style="color: var(--danger);">执行请求失败</p></div>';
    }
}

async function viewDetail(recordId) {
    try {
        const resp = await fetch('/api/test-execution/records/' + recordId + '/');
        const data = await resp.json();
        if (data.success) {
            const r = data.record;
            document.getElementById('detail-title').textContent = '执行详情';
            document.getElementById('detail-case-title').value = r.test_case_title || '';
            document.getElementById('detail-status').innerHTML = `<span class="status-badge status-${r.status}">${r.status_display || r.status}</span>`;
            document.getElementById('detail-start-time').value = formatDate(r.start_time);
            document.getElementById('detail-duration').value = r.duration ? r.duration.toFixed(2) + '秒' : '-';
            document.getElementById('detail-log').textContent = r.log || '无执行日志';
            if (r.error_message) {
                document.getElementById('error-section').style.display = 'block';
                document.getElementById('detail-error').textContent = r.error_message;
                document.getElementById('retry-btn').style.display = 'inline-flex';
            } else {
                document.getElementById('error-section').style.display = 'none';
            }
            $('#detail-modal').modal('show');
        }
    } catch (e) {
        showToast('获取详情失败', 'error');
    }
}

function retryExecution() {
    $('#detail-modal').modal('hide');
    openExecuteModal();
}

function prevPage() { if (currentPage > 1) fetchExecutionRecords(currentPage - 1); }
function nextPage() { if (currentPage < totalPages) fetchExecutionRecords(currentPage + 1); }
function refreshRecords() { fetchExecutionRecords(); fetchStats(); }
function clearFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('status-filter').value = '';
    fetchExecutionRecords();
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    try { return new Date(dateStr).toLocaleString('zh-CN'); } catch(e) { return dateStr; }
}

function showToast(message, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-exclamation-triangle'}"></i><span>${message}</span>`;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
}
</script>
{% endblock %}
